[project]
name = "fast-surface-code"
version = "0.1.0"
description = "Unitary fault-tolerant preparation of surface-code logical states"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pymatching>=2.3.1",
    "stim>=1.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipython>=8.38.0",
    "pytest>=8.0",
]
# Hardware-realistic (QuEra Gemini) noise via bloqade-circuit. Optional: only
# needed for the "gemini" noise model in the evaluation. Install with:
#   uv sync --group hardware
hardware = [
    "bloqade-circuit[cirq]>=0.7",
    "stimcirq>=1.15",
    "lark>=1.1",
    "qpsolvers>=4.0",
]
